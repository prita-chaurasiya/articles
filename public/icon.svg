    <path d="M 32 36 L 62 36 L 62 46 L 46 46 L 46 59 L 59 59 L 59 69 L 46 69 L 46 82 L 63 82 L 63 92 L 32 92 Z" />
    <!-- Letter C -->
    <path d="M 94 48 C 90 40 82 36 73 36 C 58 36 49 48 49 64 C 49 80 58 92 73 92 C 82 92 90 88 94 80 L 84 74 C 82 78 78 81 73 81 C 65 81 60 74 60 64 C 60 54 65 47 73 47 C 78 47 82 50 84 54 Z" />
