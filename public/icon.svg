      <stop offset="0%" stop-color="#E11925" />
      <stop offset="100%" stop-color="#A50E18" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
