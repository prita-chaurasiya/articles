  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#ecGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Monogram E and C -->
